[versions]
# Build tools
agp = "8.13.2"
kotlin = "2.3.0"
ksp = "2.3.11"

# AndroidX. Held at the last AGP 8 compatible releases; the newer generation
# requires AGP 9, which arrives with the Compose UI once DataBinding is gone.
appcompat = "1.7.1"
constraintlayout = "2.2.1"
core-ktx = "1.17.0"
lifecycle = "2.10.0"
navigation = "2.9.3"
preference = "1.2.1"
room = "2.8.4"
swiperefreshlayout = "1.1.0"
work = "2.11.0"

# Kotlin ecosystem
coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"

# Dependency injection
androidx-hilt = "1.3.0"
# Newest release that works with AGP 8. 2.59 passes the plugin's version check but
# calls an AGP 9 API, and 2.59.2+ rejects AGP 8 outright.
hilt = "2.58"

media3 = "1.10.1"

# Networking
okhttp = "5.4.0"
retrofit = "3.0.0"
retrofit-converter = "1.0.0"

# Third party
google-material = "1.13.0"
play-update = "2.1.0"
# 6.1.6+ is compiled with Kotlin 2.4, whose metadata Hilt 2.58 cannot read.
rssparser = "6.1.5"
timber = "5.0.1"

# Replaced in later migration phases: Glide -> Coil, Moshi -> kotlinx.serialization,
# and the View-only UI libraries.
glide = "4.16.0"
material-dialogs = "3.3.0"
moshi = "1.15.0"
halfbit-edge = "0.10"
readmore = "1.0.0"

# Test
androidx-test-ext-junit = "1.2.1"
espresso = "3.6.1"
junit = "4.13.2"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidx-hilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidx-hilt" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

google-material = { module = "com.google.android.material:material", version.ref = "google-material" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "play-update" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-converter" }
rssparser = { module = "com.prof18.rssparser:rssparser", version.ref = "rssparser" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
halfbit-edge-to-edge = { module = "de.halfbit:edge-to-edge", version.ref = "halfbit-edge" }
material-dialogs-bottomsheets = { module = "com.afollestad.material-dialogs:bottomsheets", version.ref = "material-dialogs" }
material-dialogs-core = { module = "com.afollestad.material-dialogs:core", version.ref = "material-dialogs" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
moshi-kotlin-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
readmore-textview = { module = "kr.co.prnd:readmore-textview", version.ref = "readmore" }

androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
androidx-navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
androidx-room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
